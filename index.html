html,body{margin:0;height:100%;background:#05040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
button{font:16px MaShan,Trad,sans-serif;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.pause-button{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid #c9a24a;border-radius:50%;background:#2a160bdd;box-shadow:0 2px 6px #0008}
.pause-button span{display:block;width:4px;height:13px;border-radius:1px;background:#f3e2b0}
.pause-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#05040acc;padding:20px;touch-action:none}
.pause-card{box-sizing:border-box;width:min(300px,100%);padding:22px 22px 18px;background:linear-gradient(#efdcae,#c9ae78);border:1px solid #6e461e;border-radius:6px;box-shadow:0 8px 30px #000a;text-align:center;color:#4a2a10;font:15px MaShan,Trad,sans-serif}

.pause-card p{margin:18px 0 8px;color:#7a4a20}
.pause-langs{display:grid;gap:8px}
.pause-card button{min-height:44px;border:1.5px solid #8a6a3a;border-radius:6px;background:#fff6dc;color:#3a1e08;padding:6px 12px;font-family:Trad,sans-serif}
.pause-card button[aria-pressed="true"]{border:2.5px solid #7a2a10;background:#ffe39a}
.pause-card .pause-resume{width:100%;min-height:50px;font:22px MaShan,Trad,sans-serif;background:#5a1a08;color:#ffe7a0;border-color:#e8c46a}
